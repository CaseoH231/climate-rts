<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age of Emissions</title>
  <meta name="description" content="An isometric strategy game of empires, energy and a warming world.">
  <meta name="theme-color" content="#2a2118">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <!-- Phaser game framework (stored in lib/ so the game also works offline) -->
  <script src="lib/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="src/main.js"></script>
  <script>
    // Let the game be installed as an app and run offline.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { /* not available (e.g. inside itch.io) — fine */ });
      });
    }
  </script>
</body>
</html>
